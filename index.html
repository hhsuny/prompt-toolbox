lor:var(--muted);font-size:13px;margin:0}.cards{display:grid;gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);overflow:hidden}.card-top{padding:18px 19px 15px}.card-meta{display:flex;align-items:center;gap:9px;color:var(--accent);font-size:12px;font-weight:700}.card h3{font-size:20px;line-height:1.3;margin:7px 0 7px}.summary{margin:0;color:#4b5563}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}.chip{background:#f1f5f9;color:#526174;padding:3px 8px;border-radius:5px;font-size:12px}.details{border-top:1px solid var(--line);padding:0 19px 18px}.details summary{list-style:none;padding:12px 0 8px;color:var(--accent);font-weight:700;cursor:pointer}.details summary::-webkit-details-marker{display:none}.details summary:before{content:"＋";margin-right:7px}.details[open] summary:before{content:"－"}.prompt-box{position:relative}.prompt{margin:0;white-space:pre-wrap;background:#f8fafc;border:1px solid #e8edf3;border-radius:7px;padding:15px;color:#273548;font:13px/1.75 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;max-height:560px;overflow:auto}.copy{position:absolute;right:9px;top:9px;border:1px solid #d7e0eb;background:#fff;color:var(--accent);border-radius:6px;padding:5px 9px;font-size:12px}.copy:hover{background:var(--accent);color:#fff}.footnote{color:var(--muted);font-size:13px;margin-top:28px;padding:16px 0;border-top:1px solid var(--line)}.empty{display:none;padding:40px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:9px}@media(max-width:800px){.shell{padding:18px}.layout{display:block}.toc{display:none}.toolbar{top:0}.copy-all{margin-left:0}.hero{padding:32px 18px}.hero h1{font-size:35px}.section-head{display:block}.section-desc{margin-top:5px}.card-top,.details{padding-left:15px;padding-right:15px}}

<body>
<div class="app">
<header class="hero"><div class="hero-inner"><div class="eyebrow"><i></i>AI 使用方法 · Prompt 工具箱</div><h1>12 个常用 Prompt</h1><p>把问题问清楚、把知识学明白、把复杂问题拆开、把选择变成实验，也更认真地认识自己。每条都能单独复制使用，把【】里的内容换成你的信息即可。</p><div class="stats"><span class="stat">5 个使用场景</span><span class="stat">12 条可复制提示词</span><span class="stat">无需安装 Skill</span><span class="stat">建议附上原始材料</span></div></div></header>
<main class="shell"><div class="toolbar"><div class="search"><input id="search" type="search" placeholder="搜索名称、用途或关键词…"><span>⌕</span></div><div id="filters" class="filters"></div><button id="copyAll" class="copy-all">复制当前结果</button></div><div class="layout"><aside class="toc"><h2>目录</h2><div id="toc"></div></aside><div id="content"></div></div><div id="empty" class="empty">没有找到匹配的提示词，换个关键词试试。</div><p class="footnote">使用建议：长对话类提示词（如“挖掘隐藏天赋”“人生设计术”）需要耐心完成多轮问答；研究类提示词应要求 AI 联网并核对来源；所有结论都应结合你的现实情况判断。</p></main>
</div>
<script>
const prompts=[
{id:'clarify',cat:'问清问题',title:'苏格拉底式提问',summary:'当你隐约知道自己卡住了，却说不清真正想问什么时使用。它通过一次只问一个问题，区分事实、解释、判断与目标，最后把模糊困惑整理成一个可行动的问题。',chips:['澄清困惑','最多6问','先不建议'],prompt:String.raw`我的困惑是：【尽量具体地描述发生了什么、你怎么理解，以及你卡在哪里】。
先不要给建议。请对我进行一次苏格拉底式问诊，通过最多6个问题，帮我找到真正值得回答的问题。

请遵守这些规则：
1. 每次只问一个问题，根据我的回答决定下一问，不要提前给我一整套问卷；
2. 优先区分我说的是可验证的事实、对事实的解释、价值判断，还是我希望实现的目标；
3. 检查关键词是否含糊、我默认了哪些前提、证据来自哪里、有没有相反解释，以及结论成立或不成立分别意味着什么；
4. 每次提问前，用一句话说明上一条回答让你更新了什么判断；
5. 只问可能改变结论的问题。信息足够时立刻停止，不必凑满6个。

问诊结束后，请整理出：
1. 我最开始问的问题；
2. 我真正想解决的问题；
3. 已经确认的事实；
4. 仍未验证的假设；
5. 最可能改变结论的关键变量；
6. 一个准确、具体、可以继续行动的新问题。

等我确认这个新问题以后，再给出你的判断、理由和下一步行动。`},
{id:'learn-basic',cat:'学习',title:'双层解释法',summary:'面对完全陌生的概念，先用生活化例子建立直觉，再用专业术语补上机制、边界和误解，避免停留在“好像懂了”。',chips:['概念入门','小白+专业','理解检查'],prompt:String.raw`我想学习的是：【填写概念或问题】。

请分两层解释：

第一层，小白版。
用生活化的语言和一个具体例子，让完全没有基础的人也能听懂。

第二层，专业版。
使用准确术语，讲清核心机制、适用边界和常见误解。

最后请整理出：
1. 列出小白说法与专业术语的对应关系；
2. 我最容易理解错的地方；
3. 3个用于检查我是否真正理解的问题。`},
{id:'learn-reverse',cat:'学习',title:'反向拆解',summary:'看到一个优秀网页、产品、方案或成品，想知道它为什么有效、哪些做法能迁移时使用。',chips:['案例研究','模仿学习','可执行清单'],prompt:String.raw`我想拆解的优秀范例是：【粘贴产品页面、网页、方案、流程说明、数据看板或其他成品】。
我想学会的是：【填写你希望从中学会什么】。

请先用一句话说明它解决了什么问题，再反向拆解它为什么有效。

重点分析：
1. 它服务谁，目标是什么；
2. 它采用了什么结构或流程；
3. 哪些关键选择拉开了质量差距；
4. 它的完成标准是什么；
5. 哪些规律可以迁移，哪些细节只适合这个案例。

最后请给我：
1. 提炼3到5条可复用规律；
2. 一份可以照着执行的操作清单；
3. 一个最值得先尝试的小练习。`},
{id:'learn-research',cat:'学习',title:'横纵分析法',summary:'想在半小时到一份深度报告之间，快速建立一个陌生领域的结构化认知时使用。纵向看演化，横向看竞品与差异，并要求证据可追溯。',chips:['深度研究','时间线','竞品对比'],prompt:String.raw`研究对象是：【填写产品、公司、人物、技术、行业或事件】。

请使用横纵分析法，对它完成一份可追溯的深度研究。研究截止时间为执行当天。

纵向分析：
1. 它在什么背景和需求下诞生，关键推动者是谁；
2. 它经历了哪些重要转折、成功和失败；
3. 哪些早期选择变成了今天的能力、路径依赖或包袱。

横向分析：
1. 选择最值得比较的对象，并说明为什么选它们；
2. 用统一维度比较各自的强项、短板和独特性；
3. 解释用户、客户或市场为什么选择它，又为什么放弃它。

把两条轴合起来，继续判断：
1. 过去形成的能力、路径依赖和约束会怎样影响未来；
2. 未来最可能出现哪3条路径；
3. 每条路径出现的前提和预警信号是什么。

请遵守这些证据规则：
1. 优先使用官方资料、原始数据、论文、财报和访谈等一手来源；
2. 重要结论就近标注来源与日期；
3. 事实、推断和观点分开写；
4. 遇到冲突信息时并列呈现，找不到证据时明确写“暂未核实”。

最后按以下顺序输出：核心结论、关键时间线、横向对比表、详细分析、未来判断、仍待确认的问题。报告需要在10000～30000字之间，语言尽量通俗，不要堆砌资料。`},
{id:'learn-fact',cat:'学习',title:'事实核查',summary:'核查一条观点、数据、结论或方案是否可靠。它把内容拆成事实、推理和价值判断，再逐层检查来源、因果和适用条件。',chips:['查证真假','联网核查','证据分级'],prompt:String.raw`我要核查的说法是：【粘贴观点、结论、数据或方案】。

请先把它拆成：
1. 可以被外部验证的事实；
2. 从事实推出的结论；
3. 其中包含的价值判断。

对于事实部分，请联网核查来源、样本、时间和完整上下文，并标记为：
1. 已证实；
2. 基本成立，但需要收窄；
3. 存在争议；
4. 证据不足；
5. 明显错误。

在假设相关事实成立的情况下，继续检查：
1. 这些事实能否推出当前结论；
2. 是否藏着未经验证的假设；
3. 是否混淆相关性和因果关系；
4. 是否遗漏了其他解释或关键信息；
5. 结论在什么条件下成立或失效。

最后请输出：
1. 哪些事实可信，哪些需要修正；
2. 推理链中最关键的漏洞；
3. 补强后的最合理版本；
4. 我目前可以相信到什么程度。`},
{id:'solve-panel',cat:'解决问题',title:'专家会诊',summary:'问题同时涉及产品、技术、业务、法律或人的因素时，让 AI 组织三个真正互补的专业视角，并通过相互质疑找出分歧与风险。',chips:['多视角','互相质疑','综合方案'],prompt:String.raw`我的问题是：【填写问题、已知事实、目标和现实约束】。

先不要直接给方案。请为这个问题选择3种真正互补的专业视角，并说明每种视角为什么必要。

让每种视角分别回答：
1. 它怎样重新定义这个问题；
2. 它最推荐的解决路径；
3. 其他视角最容易忽略的风险；
4. 什么新证据会让它改变判断。

然后让三种视角互相质疑，找出：
1. 共同认可的事实；
2. 真正的分歧；
3. 分歧背后的不同假设。

最后请综合输出：
1. 综合后最推荐的方案；
2. 适用条件；
3. 最大风险；
4. 退出条件；
5. 第一步行动。

不要选择三个高度相似的身份，也不要模仿或编造真实人物的观点。信息不足时，先只问我一个最关键的问题。`},
{id:'solve-first',cat:'解决问题',title:'第一性原理',summary:'当方案已经堆满补丁、被行业惯例和历史路径绑住时，回到底层事实、真实目标与约束，重新推导一条路径。',chips:['破除路径依赖','重构方案','低成本验证'],prompt:String.raw`我想解决的问题是：【填写你的问题】。

请用第一性原理把它拆回最底层，区分：
1. 已经确认、无法绕开的基本事实；
2. 习惯性接受、却没有验证过的假设；
3. 真正想实现的目标；
4. 现实中的资源与约束。

暂时放下行业惯例和现成方案，只从基本事实、目标和约束出发，重新推导可行路径。

最后请输出：
1. 原方案中只在修补表面的部分；
2. 从基本事实重新推导出的新路径；
3. 这条路径成立的前提；
4. 验证它的第一步。`},
{id:'solve-cross',cat:'解决问题',title:'跨领域借解',summary:'把当前难题抽象成跨行业的底层结构，从至少三个相距较远的领域寻找相似机制，再翻译成适合当下的低成本实验。',chips:['迁移机制','跨行业类比','可逆实验'],prompt:String.raw`我的困惑是：【说明背景、当前做法、现实约束和具体卡点】。

请先剥掉行业术语，把它抽象成一个人类在其他领域也可能遇到的问题，并找出：
1. 问题的底层结构；
2. 真正的核心矛盾；
3. 普通解法失效的原因。

然后从历史案例，以及至少3个彼此距离较远的领域中，寻找底层结构相似的问题。

每个案例都要说明：
1. 那个领域遇到了什么问题；
2. 使用了什么解决机制；
3. 与我的问题相似在哪里；
4. 哪些部分可以迁移；
5. 什么条件下会失效。

最后请选出最值得借用的3种机制，把它们翻译成适合我当前处境的解决方案，再推荐一个最值得先试的低成本、可逆实验。`},
{id:'decide-steelman',cat:'决策',title:'双向钢人论证',summary:'两个选项都各有道理、你不知道该选哪个时使用。它要求把双方论证都做到最强，找到真正分歧和最关键变量，再只问一个决定性问题。',chips:['二选一','对称论证','关键变量'],prompt:String.raw`我需要做的决定是：【写清问题、两个选项、目标和现实约束】。

先别急着回答，也别默认我已经把问题想清楚。请先做一次双向钢人论证：

1. 用最完整、有力的方式，重述我真正需要做出的选择；
2. 分别给出支持两个方向的最强理由、适用条件、最大收益、最大风险，以及最难回答的反对意见；
3. 找出双方真正的分歧、最可能改变结论的关键变量，以及还需要补充的信息；
4. 只问我一个最可能改变结论的问题。

等我回答以后，再给出明确判断、理由、适用条件和下一步行动。`},
{id:'decide-experiment',cat:'决策',title:'用最小实验替代空想',summary:'继续讨论无法带来更多清晰度时，把最关键的未知假设转成一个 7 天内可完成、低成本、可逆的现实实验。',chips:['最小实验','7天周期','数据反馈'],prompt:String.raw`我正在纠结的是：【填写你的选择或想法】。

请先找出这个决定背后最需要验证的3个假设，再选出最可能改变最终结论的那一个。

围绕这个假设，帮我设计一个低成本、可逆、能在【7天或你能接受的周期】内完成的最小实验。

请写清：
1. 具体要做什么；
2. 需要投入多少时间和资源；
3. 观察什么指标；
4. 什么结果支持继续；
5. 什么结果提醒我停止；
6. 实验结束后能获得什么新信息。

最后告诉我，明天就能开始的第一个动作是什么。`},
{id:'self-talent',cat:'认识自己',title:'挖掘隐藏天赋',summary:'通过多轮深度对话，从童年兴趣、无意识胜任区、能量模式、缺点与嫉妒中寻找可迁移的底层能力，最终形成个人天赋使用说明书。',chips:['多轮对话','能量审计','个人说明书'],prompt:String.raw`# Role：深度天赋挖掘机

## 角色
你是一位熟悉盖洛普优势识别体系、心流理论与荣格心理学的资深生涯咨询师。你相信天赋是一种可以迁移的底层能力，它经常藏在一个人的怪癖、缺点、嫉妒、无意识胜任区和能量模式里。

## 目标
通过多轮深度对话，帮助用户找到被忽视或压抑的天赋，最终生成一份极度详细、专业且有共情力的《个人天赋使用说明书》。

## 核心理念

6. 人生是一场无限游戏。任何原型都会留下信息，所以人可以对失败免疫。

## 对话规则
1. 每轮只问一个问题，采用“你问 → 用户答 → 你简短而走心地反馈 → 再问下一题”的节奏；
